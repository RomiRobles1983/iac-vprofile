name: "Vprofile IAC"

on:
  push:
    branches:
      - main
      - stage
    paths:  
      - terraform/**
  pull_request:
    branches:
      - main
    paths:
      - terraform/**

env:
  # Credentials for deployment to AWS
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  # S3 bucket for the Terraform state
  BUCKET_TF_STATE: ${{ secrets.BUCKET_TF_STATE }}
  AWS_REGION: us-east-2
  EKS_CLUSTER: vprofile-eks

jobs:
  terraform:
    name: "Apply terraform code changes"
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ./terraform

    steps:
      - name: Checkout source code 
        uses: actions/checkout@v4

      - name: Setup Terraform with specified version
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.6.3

      - name: Check Terraform version
        run: terraform version

      # --- Debug: Check that AWS secrets are loaded ---
      - name: Check AWS env variables
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "AWS credentials are missing!"
            exit 1
          else
            echo "AWS credentials loaded."
          fi
          echo "BUCKET_TF_STATE: $BUCKET_TF_STATE"

      # --- Debug: Check S3 bucket exists ---
      - name: Validate S3 bucket access
        run: |
          if aws s3 ls "s3://$BUCKET_TF_STATE" --region $AWS_REGION; then
            echo "S3 bucket exists and is accessible."
          else
            echo "Cannot access S3 bucket $BUCKET_TF_STATE"
            exit 1
          fi

      - name: Terraform init
        id: init
        run: terraform init -backend-config="bucket=$BUCKET_TF_STATE" -input=false -no-color

      - name: Terraform format
        id: fmt
        run: terraform fmt -check

      - name: Terraform validate
        id: validate
        run: terraform validate

      - name: Terraform plan
        id: plan
        run: |
          terraform plan -no-color -input=false -out planfile || echo "Plan has changes (not failing workflow)"

      # Optional: show plan result without failing workflow
      - name: Terraform show plan
        if: always()
        run: terraform show -no-color planfile || echo "No planfile generated"

      # --- Apply only if needed ---
